<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Endurance Racing 3D</title><link rel="stylesheet" href="./style.css"></head><body><main id="app"><section id="home" class="screen active"><div class="hero"><p class="eyebrow">3D RACING PROTOTYPE</p><h1>ENDURANCE<br>RACING</h1><p>左クリック・タッチだけで操作する3Dレースゲーム</p><div class="mode-grid"><button data-mode="lemans"><b>LE MANS</b><span>時間内の走行距離を競う</span></button><button data-mode="f1"><b>FORMULA</b><span>設定距離を最初に走り切る</span></button></div></div></section><section id="setup" class="screen"><div class="panel"><button id="back">← ホーム</button><h2 id="setupTitle">レース設定</h2><label>1周の長さ<select id="lapLength"><option>1</option><option>2</option><option selected>5</option><option>8</option><option>10</option><option>13.6</option><option>20</option></select> km</label><label id="timeWrap">制限時間<select id="raceTime"><option value="180">3分</option><option value="300" selected>5分</option><option value="600">10分</option><option value="900">15分</option></select></label><label id="distanceWrap">レース距離<select id="raceDistance"><option value="lap">1周</option><option value="76.25">25%</option><option value="152.5">50%</option><option value="228.75">75%</option><option value="305" selected>100%（約305km）</option></select></label><label>操作補助<select id="assist"><option value="easy">かんたん</option><option value="normal">ノーマル</option><option value="sim">シミュレーション</option></select></label><button id="start">レース開始</button></div></section><section id="race" class="screen"><canvas id="game"></canvas><div class="hud"><span>順位 <b>1/2</b></span><span id="clock">05:00</span><span>Lap <b id="lap">1</b></span></div><div class="speed"><b id="speed">0</b><small>km/h</small></div><button id="pause">Ⅱ</button><button id="reset">↻</button><div id="steer"><div id="knob"></div><small>STEER</small></div><div class="pedals"><div id="brake" class="pedal"><i></i><small>BRAKE</small></div><div id="throttle" class="pedal"><i></i><small>THROTTLE</small></div></div><div id="overlay"><div class="panel"><h2>PAUSED</h2><button id="resume">戻る</button><button id="quit">ホームへ</button></div></div></section></main><script src="./physics.js"></script><script type="module" src="./game.js"></script></body></html>
